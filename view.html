<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>屹柯组教学数据共享看板</title>
  <style>
    :root{--ink:#132c3d;--muted:#688096;--line:#dce7ed;--paper:#fff;--bg:#f3f7f9;--blue:#174666;--red:#ff3b42;--green:#19a887;--soft:#e8f6f2;--warn:#fff4dc}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}button,input{font:inherit}
    .top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;z-index:5}.brand{display:flex;gap:14px;align-items:center}.brand img{width:122px}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);margin-top:3px}.tag{padding:8px 13px;background:var(--soft);color:#087e66;border-radius:999px;font-size:12px;font-weight:700}
    main{max-width:1680px;margin:auto;padding:28px 4vw 60px}.hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 14px 40px rgba(24,55,73,.06)}.hero-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.eyebrow{color:var(--red);letter-spacing:2px;font-weight:800;font-size:12px}.hero h1{font-size:36px;margin:8px 0 10px}.sub{color:var(--muted);line-height:1.7}.fresh{min-width:280px;border-radius:14px;padding:15px 18px;background:var(--soft);color:#16745f}.fresh.warn{background:var(--warn);color:#8a5a00}.fresh.bad{background:#ffe8e8;color:#b52b2f}.fresh b{display:block;margin-bottom:6px}.fresh span{font-size:13px}
    .summary{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px;margin-top:26px}.metric{background:#f7fafb;border:1px solid var(--line);border-radius:16px;padding:18px}.metric strong{font-size:26px;display:block}.metric span{font-size:12px;color:var(--muted);margin-top:7px;display:block}
    .panel{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}.tabs{display:flex;gap:8px;overflow:auto;padding:16px;border-bottom:1px solid var(--line)}.tab{white-space:nowrap;border:1px solid var(--line);background:#f7fafb;color:var(--ink);padding:10px 15px;border-radius:11px;cursor:pointer;font-weight:700}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.tab i{font-style:normal;font-size:11px;opacity:.7;margin-left:4px}
    .tools{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px}.tools h2{margin:0;font-size:20px}.search{display:flex;gap:8px}.search input{width:250px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}.search button,.pager button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 14px;cursor:pointer}.search button{background:var(--blue);border-color:var(--blue);color:#fff}
    .table-wrap{overflow:auto;border-top:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}th{position:sticky;top:0;background:#edf5f8;text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:11px 12px;border-bottom:1px solid #edf2f4;white-space:nowrap}tbody tr:hover{background:#f8fbfc}.empty{text-align:center;padding:50px;color:var(--muted)}.pager{padding:15px 20px;display:flex;justify-content:flex-end;gap:10px;align-items:center;color:var(--muted);font-size:13px}.pager button:disabled{opacity:.4;cursor:not-allowed}.auth{max-width:540px;margin:14vh auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:38px;text-align:center}.auth h1{font-size:25px}.auth p{color:var(--muted);line-height:1.7}.hidden{display:none!important}
    .risk-number{min-width:46px;border:0;border-radius:9px;padding:7px 10px;background:#fff0ed;color:#c7433c;font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.risk-number:hover{background:#ffdeda}.risk-number:focus-visible{outline:3px solid rgba(23,70,102,.24)}
    .risk-modal{position:fixed;inset:0;z-index:20;background:rgba(8,24,35,.52);display:grid;place-items:center;padding:20px}.risk-dialog{width:min(680px,100%);max-height:min(760px,88vh);background:#fff;border-radius:22px;display:flex;flex-direction:column;box-shadow:0 28px 80px rgba(0,0,0,.25);overflow:hidden}.risk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 24px;border-bottom:1px solid var(--line)}.risk-head strong{display:block;font-size:21px}.risk-head span{display:block;color:var(--muted);font-size:13px;margin-top:6px}.risk-close{width:36px;height:36px;border:0;border-radius:10px;background:#eef4f6;color:var(--ink);font-size:22px;cursor:pointer}.risk-list{padding:10px 24px;overflow:auto}.risk-student{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding:12px 4px;border-bottom:1px solid #edf2f4}.risk-student span{font-weight:700}.risk-student code{color:var(--blue);background:#edf5f8;border-radius:7px;padding:6px 9px}.risk-actions{padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}.risk-actions button{border:1px solid var(--line);border-radius:10px;padding:10px 18px;background:#fff;cursor:pointer}.risk-actions .copy-all{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}.risk-actions .copy-all:disabled{opacity:.45}.risk-empty{text-align:center;color:var(--muted);padding:42px 12px}
    @media(max-width:900px){.top{padding:0 18px}.brand img{width:100px}.brand b{font-size:15px}.brand small{display:none}main{padding:18px}.hero{padding:20px}.hero-head{display:block}.hero h1{font-size:27px}.fresh{margin-top:18px;min-width:0}.summary{grid-template-columns:repeat(2,1fr)}.tools{align-items:flex-start;flex-direction:column}.search{width:100%}.search input{width:100%}}
  </style>
</head>
<body>
  <div id="auth" class="auth hidden"><div class="eyebrow">READ ONLY</div><h1>共享链接不可用</h1><p id="authText">请向管理员获取完整的共享链接，并确保与管理员电脑连接同一网络。</p></div>
  <div id="app" class="hidden">
    <header class="top"><div class="brand"><img src="/assets/codemao-logo.png" alt="编程猫"><div><b>屹柯组教学数据共享看板</b><small>组员只读查看 · 数据由管理员电脑统一更新</small></div></div><span class="tag">只读模式</span></header>
    <main>
      <section class="hero">
        <div class="hero-head"><div><div class="eyebrow">CODEMAO TEACHING OPS</div><h1>教学数据，一页看清</h1><div class="sub">当前统计周期：<b id="period">读取中…</b><br>此页面只能查看，无法更新数据或修改后台设置。</div></div><div id="fresh" class="fresh"><b>正在核验数据时效</b><span>请稍候…</span></div></div>
        <div class="summary"><div class="metric"><strong id="teachers">—</strong><span>本周课老师</span></div><div class="metric"><strong id="classes">—</strong><span>本周班级</span></div><div class="metric"><strong id="liveRate">—</strong><span>准时直播上座率</span></div><div class="metric"><strong id="finishRate">—</strong><span>偶数课完课率</span></div><div class="metric"><strong id="updatedAt">—</strong><span>最近更新时间</span></div></div>
      </section>
      <section class="panel"><div id="tabs" class="tabs"></div><div class="tools"><h2 id="tableTitle">数据明细</h2><form id="searchForm" class="search"><input id="searchInput" placeholder="输入姓名、班级或学员ID"><button>查询</button></form></div><div class="table-wrap"><div id="empty" class="empty">正在读取…</div><table id="table" class="hidden"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pager"><span id="pageText"></span><button id="prev">上一页</button><button id="next">下一页</button></div></section>
    </main>
  </div>
  <div id="riskModal" class="risk-modal hidden" role="dialog" aria-modal="true" aria-labelledby="riskTitle"><section class="risk-dialog"><div class="risk-head"><div><strong id="riskTitle">异常学员</strong><span id="riskSub"></span></div><button id="riskClose" class="risk-close" aria-label="关闭">×</button></div><div id="riskList" class="risk-list"></div><div class="risk-actions"><button id="riskCancel">关闭</button><button id="copyRisk" class="copy-all">一键复制姓名和 ID</button></div></section></div>
  <script>
    const state={key:new URLSearchParams(location.search).get('key')||'',name:'',page:1,size:50,pages:1,q:'',meta:null,dashboard:null,riskList:[]};
    const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtPct=v=>Number.isFinite(Number(v))?(Number(v)*100).toFixed(1)+'%':'—';
    function url(path,extra={}){const p=new URLSearchParams({key:state.key,...extra});return path+'?'+p.toString()}
    async function get(path,extra={}){const r=await fetch(url(path,extra),{cache:'no-store'});if(!r.ok)throw new Error(r.status===403?'共享密钥无效':'服务暂时不可用');return r.json()}
    function showAuth(msg){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('authText').textContent=msg}
    function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden')}
    function freshness(s){const box=$('fresh');box.className='fresh';let title='数据状态正常',text='最近成功更新：'+(s.time||'未知');const t=Date.parse((s.time||'').replace(' ','T'));const age=Number.isFinite(t)?Date.now()-t:Infinity;if(s.state==='error'){box.classList.add('bad');title='最近一次更新失败';text=(s.message||'请联系管理员')+' · '+(s.time||'') }else if(s.state==='running'){box.classList.add('warn');title='管理员正在更新数据';text='当前数据仍为上次成功结果，请稍后刷新'}else if(age>8*3600*1000){box.classList.add('warn');title='数据可能不是最新';text='最近更新：'+(s.time||'未知')+'，请联系管理员确认'}box.innerHTML='<b>'+esc(title)+'</b><span>'+esc(text)+'</span>';if(s.time)$('updatedAt').textContent=s.time.slice(5)}
    function renderTabs(){const tables=state.meta.tables||[];$('tabs').innerHTML=tables.map(t=>`<button class="tab ${t.name===state.name?'active':''}" data-name="${esc(t.name)}">${esc(t.name)} <i>${t.rows}</i></button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.name=b.dataset.name;state.page=1;state.q='';$('searchInput').value='';renderTabs();loadTable()})}
    function display(v,col){if(v===null||v===undefined)return '';const name=String(col);if(typeof v==='number'&&name.includes('同期')&&name.includes('均值'))return (v*100).toFixed(2)+'%';if(typeof v==='number'&&(name.includes('率')||name.includes('差值')))return (v*100).toFixed(1)+'%';return v}
    const riskColumns={'未完课':'incompleteList','未准时参播':'liveAbsentList','观看回放':'replayList','到课未完课':'arrivedIncompleteList'};
    function cellHtml(v,col,row,columns){const listKey=riskColumns[col];if(state.name==='组内概览'&&listKey){const teacher=row[columns.indexOf('老师')]||'';return `<button class="risk-number" data-teacher="${esc(teacher)}" data-list="${listKey}" data-label="${esc(col)}" title="点击查看学员姓名和ID">${esc(display(v,col))}</button>`}return esc(display(v,col))}
    function openRisk(teacher,listKey,label){const map=new Map();(state.dashboard?.rows||[]).filter(r=>r.teacher===teacher).forEach(r=>(r.current?.[listKey]||[]).forEach(s=>map.set(String(s.id),{id:String(s.id),name:String(s.name||'未命名学员')})));state.riskList=[...map.values()];$('riskTitle').textContent=`${teacher} · ${label}`;$('riskSub').textContent=`共 ${state.riskList.length} 名学员，点击下方按钮可复制全部姓名和 ID`;$('riskList').innerHTML=state.riskList.length?state.riskList.map(s=>`<div class="risk-student"><span>${esc(s.name)}</span><code>${esc(s.id)}</code></div>`).join(''):'<div class="risk-empty">暂无学员明细</div>';$('copyRisk').disabled=!state.riskList.length;$('copyRisk').textContent='一键复制姓名和 ID';$('riskModal').classList.remove('hidden');$('riskClose').focus()}
    function closeRisk(){$('riskModal').classList.add('hidden')}
    async function copyRiskIds(){const text=state.riskList.map(s=>`${s.name}\t${s.id}`).join('\n');if(!text)return;try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}$('copyRisk').textContent=`已复制 ${state.riskList.length} 名学员`;setTimeout(()=>{$('copyRisk').textContent='一键复制姓名和 ID'},1400)}
    async function loadTable(){try{$('empty').classList.remove('hidden');$('empty').textContent='正在读取…';$('table').classList.add('hidden');const d=await get('/shared/console-table',{name:state.name,page:state.page,size:state.size,q:state.q});state.pages=d.pages||1;$('tableTitle').textContent=d.name||state.name;$('thead').innerHTML='<tr>'+d.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';$('tbody').innerHTML=d.rows.map(r=>'<tr>'+r.map((v,i)=>'<td>'+cellHtml(v,d.columns[i],r,d.columns)+'</td>').join('')+'</tr>').join('');$('tbody').querySelectorAll('.risk-number').forEach(b=>b.onclick=()=>openRisk(b.dataset.teacher,b.dataset.list,b.dataset.label));$('empty').classList.toggle('hidden',d.rows.length>0);if(!d.rows.length)$('empty').textContent='没有符合条件的数据';$('table').classList.toggle('hidden',d.rows.length===0);$('pageText').textContent=`第 ${d.page} / ${state.pages} 页，共 ${d.total} 条`;$('prev').disabled=d.page<=1;$('next').disabled=d.page>=d.pages}catch(e){$('empty').textContent=e.message}}
    async function boot(){if(!state.key){showAuth('链接缺少访问密钥，请向管理员获取完整的共享链接。');return}try{const [status,meta,dash]=await Promise.all([get('/shared/status'),get('/shared/console-meta'),get('/shared/dashboard-data')]);showApp();state.meta=meta;state.dashboard=dash;state.name=meta.tables?.[0]?.name||'组内概览';$('period').textContent=meta.period||'未知';$('teachers').textContent=dash.summary?.teachers??'—';$('classes').textContent=dash.summary?.classes??'—';$('liveRate').textContent=fmtPct(dash.summary?.liveRate);$('finishRate').textContent=fmtPct(dash.summary?.finishRate);freshness(status);renderTabs();loadTable()}catch(e){showAuth(e.message+'。请确认管理员电脑已开启控制台，且双方连接同一网络。')}}
    $('searchForm').onsubmit=e=>{e.preventDefault();state.q=$('searchInput').value.trim();state.page=1;loadTable()};$('prev').onclick=()=>{if(state.page>1){state.page--;loadTable()}};$('next').onclick=()=>{if(state.page<state.pages){state.page++;loadTable()}};$('riskClose').onclick=closeRisk;$('riskCancel').onclick=closeRisk;$('copyRisk').onclick=copyRiskIds;$('riskModal').onclick=e=>{if(e.target===$('riskModal'))closeRisk()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRisk()});
    boot();setInterval(async()=>{try{freshness(await get('/shared/status'))}catch{}},60000);
  </script>
</body>
</html>
